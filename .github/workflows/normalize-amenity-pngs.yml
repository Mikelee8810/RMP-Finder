name: Repair failing amenity PNGs

on:
  push:
    branches: ['ui/amenities-phase-4']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/amenities-phase-4
          fetch-depth: 0

      - name: Recover and normalize the three AAPT2-failing PNGs
        run: |
          python3 -m pip install --quiet --upgrade pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import hashlib

          names = [
              'amenity_dine_in.png',
              'amenity_accessible_restroom.png',
              'amenity_accessible_seating.png',
          ]
          root = Path('app/src/main/res/drawable')
          snapshots = {}

          # The originals are truncated enough that strict Pillow fails just like
          # release AAPT2. Decode what is present, then write a clean PNG container.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          for name in names:
              p = root / name
              with Image.open(p) as im:
                  im.load()
                  rgba = im.convert('RGBA')
                  pixels = rgba.tobytes()
                  snapshots[name] = (im.mode, im.size, hashlib.sha256(pixels).hexdigest())
                  rgba.save(p, format='PNG', optimize=False, compress_level=6)

          # A repaired resource must now decode strictly, and its interpreted
          # pixels must exactly match the tolerant decode of the original.
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          for name, (before_mode, before_size, before_hash) in snapshots.items():
              p = root / name
              with Image.open(p) as check:
                  check.load()
                  after = check.convert('RGBA')
                  after_hash = hashlib.sha256(after.tobytes()).hexdigest()
                  assert check.size == before_size, (name, before_size, check.size)
                  assert after_hash == before_hash, f'pixel mismatch after re-encode: {name}'
                  print(f'{name}: {before_mode} {before_size} -> {check.mode} {check.size}; RGBA sha256={after_hash}')
          PY

      - name: Commit repaired resources and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/amenity_dine_in.png \
                  app/src/main/res/drawable/amenity_accessible_restroom.png \
                  app/src/main/res/drawable/amenity_accessible_seating.png
          git rm .github/workflows/normalize-amenity-pngs.yml
          git commit -m "Repair amenity PNG resources for release AAPT2"
          git push origin HEAD:ui/amenities-phase-4
