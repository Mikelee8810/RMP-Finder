name: Release APK

# Builds, signs, publishes and then re-verifies an installable APK.
#
# Three ways to start it:
#   - push a branch named `release/v1.1.0`, which needs no tag permission; the
#     workflow creates the real tag itself when it publishes
#   - push a tag such as v1.1.0
#   - Actions -> Release APK -> Run workflow, which GitHub only offers for
#     workflows that are on the default branch
on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in Android, e.g. 1.1.0'
        required: true
        default: '1.1.0'
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)          VERSION="${GITHUB_REF_NAME#v}" ;;
            refs/heads/release/*) VERSION="${GITHUB_REF_NAME#release/}"; VERSION="${VERSION#v}" ;;
            *)                    VERSION="${INPUT_VERSION#v}" ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.1.0, got '$VERSION'."
            exit 1
          fi
          # Derived rather than entered by hand so it always increases with the
          # version and can never collide with or fall below an earlier release.
          # 1.0.0 shipped with version code 1, and 1.0.0 derives to 10000.
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "VERSION=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "TAG=v$VERSION"
            echo "APK_NAME=RMP-Finder-$VERSION.apk"
          } >> "$GITHUB_ENV"
          echo "version $VERSION, version code $VERSION_CODE"

      - name: Require a release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RMP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RMP_KEYSTORE_BASE64 is not set."
            echo "Android refuses to install an unsigned APK, and an APK signed"
            echo "with a different key cannot upgrade an already-installed build."
            echo "See docs/release.md for how to add the signing secrets."
            exit 1
          fi

      - name: Refuse to reuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a new version instead of overwriting it."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the 241-record dataset gate
        run: |
          python3 -m pip install --quiet --upgrade jsonschema pillow requests
          python3 tools/verify_data.py
          python3 tools/check_logo_assets.py

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RMP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/rmp-release.jks"
          if [ ! -s "$RUNNER_TEMP/rmp-release.jks" ]; then
            echo "::error::RMP_KEYSTORE_BASE64 did not decode to a keystore file."
            echo "Re-copy it with: base64 -i ~/.android/debug.keystore"
            exit 1
          fi

      - name: Build the signed release APK
        env:
          RMP_KEYSTORE_FILE: ${{ runner.temp }}/rmp-release.jks
          RMP_KEYSTORE_PASSWORD: ${{ secrets.RMP_KEYSTORE_PASSWORD }}
          RMP_KEY_ALIAS: ${{ secrets.RMP_KEY_ALIAS }}
          RMP_KEY_PASSWORD: ${{ secrets.RMP_KEY_PASSWORD }}
          RMP_VERSION_NAME: ${{ env.VERSION }}
          RMP_VERSION_CODE: ${{ env.VERSION_CODE }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::warning::MAPTILER_KEY is not set. The directory, search, filters and"
            echo "details still work offline, but the Map tab will fall back to its outage state."
          fi
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify the APK is signed by the expected key
        env:
          # Android only installs an upgrade when the new build carries the same
          # signing certificate as the installed one. 1.0.0 shipped with this
          # fingerprint, so a mismatch here means the published APK would force
          # an uninstall. Set the EXPECTED_SIGNER_SHA256 repository variable to
          # roll the key deliberately.
          EXPECTED_SIGNER_SHA256: ${{ vars.EXPECTED_SIGNER_SHA256 || '97:30:23:F7:B7:91:A9:DA:C0:7E:1B:8C:F1:65:9D:F1:ED:44:1F:41:83:8C:04:02:9D:DB:2C:5D:E4:CE:10:84' }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          BUILT="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "apksigner: $APKSIGNER"
          echo "apk: $BUILT"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT" | tee signer.txt

          EXPECTED="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(grep -iEo 'SHA-256 digest: *[0-9a-f]{64}' signer.txt | head -1 | grep -Eo '[0-9a-f]{64}')"
          echo "expected signer: $EXPECTED"
          echo "actual signer:   $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a signer certificate digest from the built APK."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::This APK is signed by a different key than the installed 1.0.0 build."
            echo "Android would refuse to install it as an upgrade and the app would have to be"
            echo "uninstalled first, clearing saved favorites and statuses. Check RMP_KEYSTORE_BASE64,"
            echo "or set the EXPECTED_SIGNER_SHA256 repository variable if the key change is intended."
            exit 1
          fi
          echo "Signer matches the key 1.0.0 was signed with; this build upgrades in place."
          mkdir -p dist
          cp "$BUILT" "dist/$APK_NAME"

      - name: Measure the APK
        run: |
          python3 tools/apk_report.py "dist/$APK_NAME" --expect-abis arm64-v8a | tee apk-report.txt
          echo "APK_MB=$(du -m "dist/$APK_NAME" | cut -f1)" >> "$GITHUB_ENV"

      - name: Checksum the APK
        working-directory: dist
        run: |
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"
          echo "APK_SHA256=$(cut -d' ' -f1 < "$APK_NAME.sha256")" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "RMP Finder ${VERSION} personal Android install build."
            echo
            echo "Built and signed by GitHub Actions from \`${GITHUB_SHA}\`."
            echo
            echo "- \`versionName\` ${VERSION}, \`versionCode\` ${VERSION_CODE}"
            echo "- Bundled 241-location RMP directory, verified by \`tools/verify_data.py\` in this run"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo
            echo "Install: download \`${APK_NAME}\` under Assets, open it on Android, tap Install."
            echo "See [docs/install.md](docs/install.md) for the full steps."
          } > dist/notes.md
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "RMP Finder ${VERSION}" \
            --notes-file dist/notes.md \
            $FLAGS \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256"

      - name: Verify the published copy on GitHub matches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p readback && cd readback
          gh release download "$TAG" --pattern "$APK_NAME" --dir .
          DOWNLOADED="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"
          echo "built:      $APK_SHA256"
          echo "downloaded: $DOWNLOADED"
          if [ "$DOWNLOADED" != "$APK_SHA256" ]; then
            echo "::error::The APK published on GitHub does not match the APK this run built."
            exit 1
          fi
          echo "The GitHub-hosted APK matches the build output."

      - name: Summary
        run: |
          {
            echo "### RMP Finder ${VERSION} published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| APK | \`$APK_NAME\` |"
            echo "| SHA-256 | \`$APK_SHA256\` |"
            echo "| Size | ${APK_MB} MB, arm64-v8a only |"
            echo "| Integrity | GitHub-hosted copy re-downloaded and matched |"
            echo
            echo '```'
            cat apk-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
