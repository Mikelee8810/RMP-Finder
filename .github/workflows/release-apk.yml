name: Release APK

# Builds, signs, publishes and then re-verifies an installable APK.
# Run it from the Actions tab: Release APK -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in Android, e.g. 1.1.0'
        required: true
        default: '1.1.0'
      version_code:
        description: 'Version code. Must be higher than the previous release (1.0.0 used 1).'
        required: true
        default: '2'
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    env:
      TAG: v${{ inputs.version_name }}
      APK_NAME: RMP-Finder-${{ inputs.version_name }}.apk
    steps:
      - uses: actions/checkout@v4

      - name: Require a release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RMP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RMP_KEYSTORE_BASE64 is not set."
            echo "Android refuses to install an unsigned APK, and an APK signed"
            echo "with a different key cannot upgrade an already-installed build."
            echo "See docs/release.md for how to add the signing secrets."
            exit 1
          fi

      - name: Refuse to reuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a new version instead of overwriting it."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the 241-record dataset gate
        run: |
          python3 -m pip install --quiet --upgrade jsonschema pillow
          python3 tools/verify_data.py
          python3 tools/check_logo_assets.py

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RMP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rmp-release.jks"
          test -s "$RUNNER_TEMP/rmp-release.jks"

      - name: Build the signed release APK
        env:
          RMP_KEYSTORE_FILE: ${{ runner.temp }}/rmp-release.jks
          RMP_KEYSTORE_PASSWORD: ${{ secrets.RMP_KEYSTORE_PASSWORD }}
          RMP_KEY_ALIAS: ${{ secrets.RMP_KEY_ALIAS }}
          RMP_KEY_PASSWORD: ${{ secrets.RMP_KEY_PASSWORD }}
          RMP_VERSION_NAME: ${{ inputs.version_name }}
          RMP_VERSION_CODE: ${{ inputs.version_code }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::warning::MAPTILER_KEY is not set. The directory, search, filters and"
            echo "details still work offline, but the Map tab will fall back to its outage state."
          fi
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify the APK is actually signed
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          BUILT="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "apksigner: $APKSIGNER"
          echo "apk: $BUILT"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT"
          mkdir -p dist
          cp "$BUILT" "dist/$APK_NAME"

      - name: Checksum the APK
        working-directory: dist
        run: |
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"
          echo "APK_SHA256=$(cut -d' ' -f1 < "$APK_NAME.sha256")" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "RMP Finder ${{ inputs.version_name }} personal Android install build."
            echo
            echo "Built and signed by GitHub Actions from \`${GITHUB_SHA}\`."
            echo
            echo "- \`versionName\` ${{ inputs.version_name }}, \`versionCode\` ${{ inputs.version_code }}"
            echo "- Bundled 241-location RMP directory, verified by \`tools/verify_data.py\` in this run"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo
            echo "Install: download \`${APK_NAME}\` under Assets, open it on Android, tap Install."
            echo "See [docs/install.md](docs/install.md) for the full steps."
          } > dist/notes.md
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "RMP Finder ${{ inputs.version_name }}" \
            --notes-file dist/notes.md \
            $FLAGS \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256"

      - name: Verify the published copy on GitHub matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p readback && cd readback
          gh release download "$TAG" --pattern "$APK_NAME" --dir .
          DOWNLOADED="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"
          echo "built:      $APK_SHA256"
          echo "downloaded: $DOWNLOADED"
          if [ "$DOWNLOADED" != "$APK_SHA256" ]; then
            echo "::error::The APK published on GitHub does not match the APK this run built."
            exit 1
          fi
          echo "The GitHub-hosted APK matches the build output."

      - name: Summary
        run: |
          {
            echo "### RMP Finder ${{ inputs.version_name }} published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| APK | \`$APK_NAME\` |"
            echo "| SHA-256 | \`$APK_SHA256\` |"
            echo "| Integrity | GitHub-hosted copy re-downloaded and matched |"
          } >> "$GITHUB_STEP_SUMMARY"
