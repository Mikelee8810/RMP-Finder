name: One-shot fix coordinate precision and finish sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-coordinate-precision.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-fix-coordinate-precision
  cancel-in-progress: false

jobs:
  fix-and-sync:
    name: Fix precision, rebuild, verify, commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --quiet --upgrade certifi pillow requests jsonschema

      - name: Fix reviewed-coordinate precision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/sync_notion.py')
          text = p.read_text()
          old = '"matchQuality": "manual", "precision": "reviewed",'
          new = '"matchQuality": "manual", "precision": "unknown",'
          if old not in text:
              raise SystemExit('expected coordinate precision anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Rebuild dataset from already-refreshed Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 tools/sync_notion.py

      - name: Verify rebuilt dataset and service-fact tests
        run: |
          python3 tools/verify_data.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/check_logo_coverage.py
          python3 tools/check_logo_assets.py

      - name: Commit fix and rebuilt dataset
        run: |
          git config user.name "rmp-finder-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add tools/sync_notion.py data/ app/src/main/assets/
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Fix reviewed coordinate precision and sync service facts"
          git push
