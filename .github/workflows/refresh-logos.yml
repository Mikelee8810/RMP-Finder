name: Refresh restaurant logos

# The curation step needs to reach the restaurant websites, which a sandboxed
# development environment usually cannot. Run it when logo coverage should be
# re-checked, then review the commit it pushes.
#
# Three ways to start it:
#   - push a branch named `logo-refresh`, which needs no tag permission
#   - push a tag beginning with `logos-`
#   - Actions -> Refresh restaurant logos -> Run workflow, which GitHub only
#     offers for workflows that are on the default branch
on:
  push:
    branches: ['logo-refresh']
    tags: ['logos-*']
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Discard every bundled icon first instead of keeping ones this run cannot re-fetch'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    name: Re-capture website icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install curation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          python3 -m pip install --quiet --upgrade requests pillow cairosvg jsonschema

      - name: Capture icons
        run: |
          if [ "${{ inputs.fresh }}" = "true" ]; then
            python3 tools/build_logos.py --fresh
          else
            python3 tools/build_logos.py
          fi

      - name: Enforce the asset quality gate
        run: |
          python3 tools/check_logo_assets.py
          python3 tools/verify_data.py

      - name: Commit any change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PATHS="app/src/main/assets/restaurant-logos data/source/website-logo-discovery-2026-09-10.json"
          # git diff only reports tracked files, so a run whose only result is a
          # newly captured icon would look like no change at all.
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "No logo change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          COUNT="$(find app/src/main/assets/restaurant-logos -name '*.png' | wc -l | tr -d ' ')"
          git commit \
            -m "Refresh restaurant logo assets" \
            -m "Re-ran tools/build_logos.py with network access. Bundled assets: ${COUNT}. Every asset passes the curator quality gate and is recorded in the discovery evidence."
          case "$GITHUB_REF" in
            refs/tags/*)
              # A tag names no branch, and the checkout is shallow with no remote
              # branches, so ask GitHub which branch this commit heads.
              BRANCH="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/branches-where-head" --jq '.[0].name // empty')"
              ;;
            *)
              BRANCH="$GITHUB_REF_NAME"
              ;;
          esac
          if [ -z "$BRANCH" ]; then
            echo "::error::This commit is not the head of any branch, so the refreshed logos have nowhere to go."
            echo "Tag the head of a branch, or run the workflow from the Actions tab."
            exit 1
          fi
          echo "pushing refreshed logos to $BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          COUNT="$(find app/src/main/assets/restaurant-logos -name '*.png' | wc -l | tr -d ' ')"
          echo "### Logo refresh complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundled assets: **${COUNT}**" >> "$GITHUB_STEP_SUMMARY"
