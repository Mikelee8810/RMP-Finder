name: One-shot refresh service facts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-refresh-service-facts.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-refresh-service-facts
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Google facts and rebuild dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --quiet --upgrade certifi pillow requests jsonschema

      - name: Refresh all Google Places service facts once
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$GOOGLE_PLACES_KEY" ]; then
            echo "::error::NOTION_TOKEN and GOOGLE_PLACES_KEY must both be set."
            exit 1
          fi
          python3 tools/backfill_google.py --limit 0 --refresh-cache

      - name: Persist the paid-response cache immediately
        run: |
          git config user.name "rmp-finder-bot"
          git config user.email "noreply@users.noreply.github.com"
          if git diff --quiet -- data/source/google-places-cache.json; then
            echo "Google cache did not change."
          else
            git add data/source/google-places-cache.json
            git commit -m "Refresh Google Places service facts cache"
            git push
          fi

      - name: Rebuild dataset from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 tools/sync_notion.py

      - name: Verify rebuilt dataset
        run: |
          python3 tools/verify_data.py
          python3 tools/check_logo_coverage.py
          python3 tools/check_logo_assets.py

      - name: Commit rebuilt dataset if changed
        run: |
          if git diff --quiet -- data/ app/src/main/assets/; then
            echo "No dataset changes after refresh."
            exit 0
          fi
          git add data/ app/src/main/assets/
          git commit -m "Sync refreshed service facts into restaurant dataset"
          git push
