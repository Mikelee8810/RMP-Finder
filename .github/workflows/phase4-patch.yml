name: Phase 4 amenity layout patch

on:
  push:
    branches: ['ui/amenities-phase-3']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/amenities-phase-3

      - name: Replace old amenity text block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/mike/rmpfinder/ui/RmpFinderUi.kt')
          text = path.read_text()
          start_marker = '''            if (hasServiceFacts) {
              item {
                  DetailCard("At this location") {'''
          next_marker = '''
            item {
                DetailCard("Hours") {'''
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          replacement = '''            if (hasServiceFacts) {
                item {
                    DetailCard("At this location") {
                        AmenityFactsContent(restaurant)
                    }
                }
            }
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Remove temporary workflow and commit Phase 4
        run: |
          git rm .github/workflows/phase4-patch.yml
          git add app/src/main/java/com/mike/rmpfinder/ui/RmpFinderUi.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 4: replace amenity text with icon layout"
          git push origin HEAD:ui/amenities-phase-3
