name: Android CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify data, unit tests, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the 241-record dataset gate
        run: |
          python3 -m pip install --quiet --upgrade jsonschema
          python3 tools/verify_data.py

      - name: Check bundled logo assets against the quality gate
        run: |
          python3 -m pip install --quiet --upgrade pillow
          python3 tools/check_logo_assets.py

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rmp-finder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
