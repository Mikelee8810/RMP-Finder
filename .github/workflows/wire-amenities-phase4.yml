name: Wire amenities Phase 4

on:
  push:
    branches: ['ui/amenities-phase-4']

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/amenities-phase-4
          fetch-depth: 0

      - name: Replace legacy amenity text block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/mike/rmpfinder/ui/RmpFinderUi.kt')
          text = path.read_text()
          start_marker = '            if (hasServiceFacts) {\n'
          end_marker = '            item {\n                DetailCard("Hours")'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          lines = [
              '            if (hasServiceFacts) {',
              '                item {',
              '                    DetailCard("At this location") {',
              '                        AmenityFactsContent(restaurant)',
              '                    }',
              '                }',
              '            }',
              '',
          ]
          replacement = '\n'.join(lines) + '\n'
          updated = text[:start] + replacement + text[end:]
          if updated.count('AmenityFactsContent(restaurant)') != 1:
              raise SystemExit('Expected exactly one AmenityFactsContent call')
          path.write_text(updated)
          PY

      - name: Commit Phase 4 wiring and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/mike/rmpfinder/ui/RmpFinderUi.kt
          git rm -f .github/workflows/wire-amenities-phase4.yml .github/workflows/phase4-patch.yml
          git commit -m "Phase 4: wire amenity cards into restaurant details"
          git push origin HEAD:ui/amenities-phase-4
